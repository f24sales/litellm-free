# Optional drop-in for litellm-free-import.service; uses the locally built image.
[Service]
# Rootless Podman may need its host UID/GID mapping helpers.
# The container itself still receives no-new-privileges below.
NoNewPrivileges=false
PrivateTmp=false
ExecStart=
ExecStart=/usr/bin/podman run --rm --pull=never --read-only --cap-drop=ALL --security-opt=no-new-privileges --env-file %h/.config/litellm-free/config.conf --env-file %h/.config/litellm-free/.env localhost/litellm-free-import:latest api
