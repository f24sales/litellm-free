[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-free-config"
version = "0.1.0"
description = "Validation, publication and webhook helpers for F24 SALES LiteLLM catalogs"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["litellm_export", "config_files", "hook_client"]
