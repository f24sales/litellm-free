[Unit]
ConditionPathExists=%h/litellm-free/update/web-config/use-host

[Service]
RuntimeDirectoryPreserve=yes
Environment=FREE_WEB_DATA_DIR=%h/litellm-free
Environment=FREE_WEB_STATE_DIR=%h/litellm-free/update/web-state
Environment=FREE_WEB_PUBLISHED_FILE=published_catalog.json
Environment=FREE_WEB_YAML_FILE=litellm-free.yaml
Environment=FREE_WEB_ENV_FILE=%h/litellm-free/update/web-config/host.env
ExecStart=
ExecStart=/usr/bin/python3 -m uvicorn web:app --uds %t/litellm-free/litellm-free-host.sock --no-access-log --no-server-header
ExecStartPost=/usr/bin/bash %h/litellm-free/update/scan/deploy/select-webui.sh host
