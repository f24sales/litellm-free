name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install . -r requirements-import.txt pytest
      - run: python -m pytest -q tests
      - run: docker build -f Containerfile -t litellm-free-import:test .
      - run: docker run --rm --network none litellm-free-import:test --help
