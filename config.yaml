{
  "litellm_base_url": "http://localhost:4000",
  "client_key_alias": "litellm-free",
  "access_group": "litellm-free",
  "timeout_seconds": 30,
  "retries": 3,
  "reasoning_variants": true,
  "merge_rules": [],
  "providers": {
    "openrouter": {
      "enabled": true,
      "api_base": "https://openrouter.ai/api/v1",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": [],
      "proxy_catalog_path": null
    },
    "groq": {
      "enabled": true,
      "api_base": "https://api.groq.com/openai/v1",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": ["(?i)whisper|tts|guard|speech|transcri|orpheus"],
      "proxy_catalog_path": null
    },
    "kilo": {
      "enabled": true,
      "api_base": "https://api.kilo.ai/api/gateway",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": [],
      "proxy_catalog_path": null
    },
    "nous": {
      "enabled": true,
      "api_base": "https://inference-api.nousresearch.com/v1",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": [],
      "free_allowlist": [],
      "tags_mode": "auto",
      "proxy_catalog_path": null
    },
    "opencode": {
      "enabled": true,
      "api_base": "https://opencode.ai/zen/v1",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": [],
      "free_suffixes": ["-free", ":free"],
      "proxy_catalog_path": null
    },
    "nvidia": {
      "enabled": true,
      "api_base": "https://integrate.api.nvidia.com/v1",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": [],
      "free_allowlist": [
        "^deepseek-ai/deepseek-v4\\.1-flash$",
        "^z-ai/glm-5\\.3$",
        "^z-ai/glm-5\\.3-flash$",
        "^moonshotai/kimi-k3$"
      ],
      "proxy_catalog_path": null
    }
  }
